# =====================================================================
#  AYN Thor bottom screen - style settings
# =====================================================================
#  How to edit:  change the value after the "=", save. Lines starting
#  with # are notes and are ignored. Delete a line to use its default.
#
#  Colours:  #RRGGBB  (e.g. #1A9FFF). Any colour picker shows this code.
#  Sizes:    dp  (about 1/160 inch; 10 dp is about 1.6 mm)
#  Opacity:  percent, 0 = invisible, 100 = solid
#
#  Two ways to apply it:
#   A) Rebuild: run build-bottom-screen.ps1 (it puts this file into the app).
#   B) No rebuild: copy this file to the Thor as
#      Android/data/com.limelight.thor/files/  (release build; debug builds use
#      com.limelight.vplus_debug)  (same file name)
#      then open the hub wheel > Options > Reload style.
# =====================================================================


# ---------------- Colours ----------------

# Accent colour (Thor palette aqua). Only the first entry is used.
accent_colors = #55B8D4

# Button and wheel text
text_color = #A3AFB9
# Faded captions (L TOUCHPAD, MOUSE ...)
text_dim_color = #5E6A74
# Text on a pressed button / highlighted wheel item
pressed_text_color = #F1F4F6
# Screen background. Keep #000000 on OLED (black pixels are off = no burn-in).
background_color = #000000

# How much the accent is lifted toward white for highlights (0 = flat, no gradient)
gradient_white_mix_percent = 0


# ---------------- Shapes and lines ----------------

# Corner roundness of the two pads and the mouse pad
pad_corner_dp = 14
# Corner roundness of buttons
button_corner_dp = 10
# Line thickness at rest, and when lit (touched/pressed)
line_width_dp = 1.5
lit_line_width_dp = 2
# Brightness of outlines at rest (low = less burn-in)
idle_line_opacity_percent = 29
# Length of the corner marks shown on idle pads
corner_mark_length_dp = 28
# Strength of the coloured wash inside a touched pad or pressed button
lit_fill_opacity_percent = 14

# Text sizes
label_size_dp = 15
caption_size_dp = 11


# ---------------- Touch effects ----------------

# Glow under your finger: size and strength
touch_glow_size_dp = 40
touch_glow_opacity_percent = 18
# Dot under your finger
touch_dot_size_dp = 10
# Fading trail behind your finger: number of dots (0 = no trail) and fade time
trail_length = 0
trail_fade_ms = 260
# Button ripple duration
ripple_ms = 160


# ---------------- Layout ----------------

# Height of the bottom button row, as percent of the screen height
button_row_height_percent = 17
# Space between pads and buttons
gap_dp = 10
# Width of the centre column between the two pads (holds the wheel hub)
hub_column_dp = 64
# Size of the radial wheel
wheel_radius_dp = 130


# ---------------- OLED care (burn-in) ----------------

# Captions disappear this long after your last touch
caption_hide_seconds = 4
# Everything dims after this long without a touch...
dim_after_seconds = 10
# ...to this brightness
dim_brightness_percent = 22
# ...and goes fully black after this long (touch anywhere to wake)
black_after_seconds = 60
# Pixel shift: how often the layout moves, and how far at most
pixel_shift_every_seconds = 30
pixel_shift_max_dp = 3


# ---------------- Defaults for the OPTIONS wheel ----------------
# Used until you change them in OPTIONS (your choice there is remembered).

# on / off
pixel_shift_default = on
# 0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.5 or 3
mouse_speed_default = 1

# How long GYRO CALIBRATE averages the gyro (seconds, 1-30). Longer = more accurate.
gyro_calibration_seconds = 5
